excluded_from_candidate_surface:
- reason: Irreversible money movement with no documented reversal operation and no
    idempotency key. Should not be exposed to an agent without a human-in-the-loop gate.
  paths:
  - /open_pay/v2/prepare_order
  - /omp-payment-open-api/v2/distribute
- reason: Mandatory analytics reporting, not an agent capability.
  paths:
  - play/browse/impression data callbacks

blockers_for_a_real_server:
- Every call requires an HMAC-SHA1 + MD5 signature computed over sorted parameters,
  with a fresh nonce and timestamp per request. An MCP server would have to hold the
  app_secret and sign server-side.
- Credentials are issued only after commercial onboarding; there is no self-service key,
  so a public MCP server could not be usable by an arbitrary agent operator.
- Duplicate nonce/timestamp is rejected (error 225), so naive retry logic in an agent
  loop will fail rather than replay safely.
- No OpenAPI means no machine-generated inputSchemas; every tool schema would be
  hand-written from HTML tables.
