search_evidence:
- No MCP server is published by Ximalaya on any host, in the XimalayaCloud GitHub org
  (7 public repos, all infrastructure OSS), or on npm/PyPI.
- No /.well-known/agent-card.json or /.well-known/agent.json on any of 7 Ximalaya hosts
  (probed 2026-09-04) — so no agent card pointing at an MCP endpoint either.
- No MCP endpoint URL is named anywhere in the Open Platform documentation.
- The only "ximalaya" MCP-adjacent package on npm is dsh-ximalaya, a third-party
  DeepSeek-harness plugin, not a Ximalaya product.

derivation_caveat: >-
  This candidate is derived from DOCUMENTATION, not from an OpenAPI document, because
  Ximalaya publishes no machine-readable spec. Each candidate tool below therefore
  carries the documented endpoint path but NOT a real inputSchema — parameters are
  documented in HTML tables and were not transcribed into schemas here, because doing
  so would manufacture a contract Ximalaya has not published. Any implementer must
  read the parameter tables from the docs.

