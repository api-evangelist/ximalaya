note: >-
  NOBODY SHIPS AN MCP SERVER FOR XIMALAYA. This file is a CANDIDATE tool surface
  derived from the provider's published REST operations, not a server that exists. It
  is wired into apis.yml as type X-MCPServerCandidate, deliberately NOT as MCPServer,
  because an MCPServer pointer asserts the provider operates an agent-callable
  endpoint and Ximalaya does not.

