generated: '2026-09-04'
method: searched
source: >-
  https://open.ximalaya.com/doc/detailApi?categoryId=6&articleId=66 (测试账号),
  https://open.ximalaya.com/doc/detailApi?categoryId=7&articleId=70 (API接入指南),
  https://open.ximalaya.com/doc/tool
note: >-
  Ximalaya has NO separate sandbox environment. There is no test host, no test-mode
  key prefix and no isolated data set — the published "test accounts" are real
  applications pointed at PRODUCTION (线上环境), and the test content is real
  production catalog. This is the defining characteristic of testing on this platform
  and it is what makes the paid-content flows genuinely risky to exercise.

sandbox_environment:
  separate_host: false
  separate_key_prefix: false
  test_mode_flag: false
  environment: production only
  provider_quote: 以下测试账号为线上的联调测试账号，适用于线上环境的联调测试
  provider_quote_translation: >-
    "The following test accounts are online integration-test accounts, suitable for
    integration testing in the production environment."
  internal_environments_note: >-
    Ximalaya's own JS bundle references open.test.ximalaya.com and
    open.uat.ximalaya.com (plus matching passport/upload hosts). These are internal
    staging environments and are not offered to partners anywhere in the
    documentation; they are recorded here as an observation, not as an available
    surface.

credentials:
  published: true
  published_location: https://open.ximalaya.com/doc/detailApi?categoryId=6&articleId=66
  count: 2
  redaction_note: >-
    Ximalaya publishes two complete shared test credential sets (app_key, appSecret and
    serverAuthStaticKey) openly in its documentation. The values are deliberately NOT
    copied into this repository — they are live production credentials shared across
    every developer reading the page, and mirroring them here would both trip secret
    scanning and widen their exposure. Follow the source URL above to read them.
  sets:
  - id: test-account-1
    purpose: Free content integration, and paid distribution in "partner collects
      payment" (合作伙伴收款) mode.
    fields_published: [app_key, appSecret, serverAuthStaticKey]
  - id: test-account-2
    purpose: Paid distribution in the shared/generic checkout (通用收银台) mode.
    fields_published: [app_key, appSecret, serverAuthStaticKey]
  shared_credential_risk: >-
    Because these keys are shared and unscoped-per-developer, the per-application rate
    limit (5000/min, 280000/hour) is consumed by everyone testing at once, and the
    per-UID risk-control trigger (error 110) can be tripped by other people's traffic.
    The JS SDK docs separately note that the hosted jssdk_sig helper is restricted to
    the test app_key and rate-limited, and must be replaced with a partner-hosted
    sig_url before launch.

