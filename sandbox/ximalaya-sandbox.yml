refunds_in_testing:
  supported: false
  provider_quote: 一般不支持退款…如有测试退款需求请提前与商务沟通对接，否则不允退款
  provider_quote_translation: >-
    "Refunds are generally not supported… if you need a test refund, arrange it with
    your business contact in advance, otherwise refunds will not be permitted."
  guidance_published: >-
    Ximalaya advises testing with the lowest-priced products available and asking the
    operations team to provision cheap test products. Because purchases are real, an
    unplanned test purchase is not automatically recoverable.

tooling:
- name: Server-side API debugging tool (服务端API调试工具)
  url: https://open.ximalaya.com/doc/tool
  description: >-
    Hosted console that computes the sig signature and issues live calls against
    production. The only interactive way to exercise the signature algorithm without
    implementing it first.
- name: JS SDK hosted signing helper
  path: /openapi-collector-app/jssdk_sig
  host: https://api.ximalaya.com
  description: >-
    Ximalaya-hosted signature endpoint for browser integrations. Restricted to the
    published test app_key and rate-limited; partners must stand up their own sig_url
    before going live.

test_clocks: false
fixture_triggers: false
mock_server: false

gaps:
- No isolated sandbox environment or test data set.
- No test-mode credentials of the partner's own; the published ones are shared.
- No way to simulate order states (cancelled/refunded/failed/processing) without
  transacting real money.
- No time simulation or event-trigger tooling for the four inbound callbacks, so a
  partner cannot rehearse order_status_notify handling on demand.
