apis:
- aid: ximalaya-open-platform-api
  name: Ximalaya Open Platform API
  description: 'The core Ximalaya Open Platform HTTP+JSON API on api.ximalaya.com:
    free on-demand content (albums, tracks, categories, tags), paid on-demand content
    metadata, content search with hot/suggest words, recommendation, content-operations
    surfaces (columns, banners, ranks, dimensions), broadcast radio, OAuth 2.0 account
    authorization, user profile / subscription / cloud play-history, and the mandatory
    play, browse and impression analytics callbacks. Requests carry common parameters
    (app_key, client_os_type, nonce, timestamp, device_id, device_id_type, server_api_version)
    plus a computed sig signature.'
  humanURL: https://open.ximalaya.com/doc/api
