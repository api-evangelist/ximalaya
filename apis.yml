aid: ximalaya
name: Ximalaya
description: 'Ximalaya (喜马拉雅) is China''s largest online audio and podcast platform,
  distributing audiobooks, radio dramas, children''s content, courses, news and live
  broadcast radio. Its developer surface is the Ximalaya Open Platform (open.ximalaya.com),
  a partner-oriented program that lets mobile apps, smart speakers, in-car head units,
  H5 sub-sites and WeChat mini-programs embed Ximalaya audio. The platform publishes
  a documented HTTP+JSON API across two hosts — api.ximalaya.com for content, search,
  recommendation, OAuth2 accounts, user data and analytics callbacks, and mpay.ximalaya.com
  for paid-content distribution, pricing and orders — secured by an app_key plus an
  HMAC-SHA1/MD5 request signature, with OAuth 2.0 access tokens for user-private data.'
image: https://s1.xmcdn.com/yx/open-website/last/build/favicon.ico
