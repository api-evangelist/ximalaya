- aid: ximalaya-open-pay-distribution-api
  name: Ximalaya Paid Content & Distribution API
  description: 'The paid-content and distribution HTTP+JSON API on mpay.ximalaya.com:
    product/price lookup (get_price_info, get_gradient_activity_price_info), album
    and track distribution (distribute, v2/distribute, get_distributed_product_infos),
    order preparation and order detail (prepare_order, get_order_detail), purchase-state
    checks (album_bought_status, track_bought_status, get_bought), and authorized
    playback URL issuance for paid audio and video (get_play_info, batch_get_play_info,
    get_video_play_info). Order results are delivered back to the partner over a signed
    order_status_notify callback.'
  humanURL: https://open.ximalaya.com/doc/detailApi?categoryId=15&articleId=31
